name: update schedule

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# 关键：给内置令牌写入权限，配合第一步根治 128
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 20.x 已弃用，升 22.x，弃用 warning 一并消失
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: install yarn
        run: npm install yarn -g
      - run: yarn install
      - run: yarn build
      - run: yarn m3u
      - run: yarn matrix

      - name: "Jekyll theme"
        run: mv ./_config.temp.yml ./m3u/_config.yml

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./m3u
          enable_jekyll: true
          # 删掉了 cname: m3u.ibert.me —— 那是原作者的域名，
          # 你 fork 没这个域名，留着会让 GitHub Pages 域名所有权验证失败
